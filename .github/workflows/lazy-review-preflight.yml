name: Lazy review preflight
on:
  push:
    branches: [codex/vscode-lazy-review-preflight]
permissions:
  contents: read
env:
  BASE_SHA: 0817aaa824590067854c361e77eb973a08b3cf48
jobs:
  debugger:
    env:
      PATCH_SHA: ${{ matrix.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            patch: lazy
            sha: 98f90be7879884d32ee43af3d69c710d29e3ca59
            scope: debug
          - os: windows-2022
            browser: chromium
            patch: lazy
            sha: 98f90be7879884d32ee43af3d69c710d29e3ca59
            scope: debug
          - os: macos-26
            browser: webkit
            patch: lazy
            sha: 98f90be7879884d32ee43af3d69c710d29e3ca59
            scope: debug
    name: ${{ matrix.patch }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PATCH_SHA }}
          fetch-depth: 3
      - name: Verify exact contribution and merge baseline
        run: |
          test "$(git rev-parse HEAD)" = "$PATCH_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "Tested $PATCH_SHA; target $BASE_SHA; workflow $GITHUB_SHA"
          git show --stat --oneline HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install locked validation dependencies
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix build --ignore-scripts --no-audit --no-fund
          node build/npm/electronTypes.ts
          npm exec -- playwright install --with-deps ${{ matrix.browser }}
      - name: Validate source and changed paths
        run: |
          npm run typecheck-client
          changed=()
          while IFS= read -r path; do changed+=("$path"); done < <(git diff --name-only "$BASE_SHA" "$PATCH_SHA")
          node build/hygiene.ts "${changed[@]}"
          npm run eslint -- "${changed[@]}"
          git diff --check "$BASE_SHA"
      - name: Transpile client and run debugger browser suites
        run: |
          npm run transpile-client
          npm run test-browser-no-install -- --browser ${{ matrix.browser }} --runGlob '**/contrib/${{ matrix.scope }}/test/**/*.test.js' --tfs DebuggerBrowser
      - name: Install Electron
        run: npm run electron
      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root .build/electron/chrome-sandbox
          sudo chmod 4755 .build/electron/chrome-sandbox
      - name: Build macOS filesystem addon
        if: runner.os == 'macOS'
        run: npm rebuild @vscode/fs-copyfile
      - name: Debugger Electron suites (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./scripts/test.sh --runGlob '**/contrib/${{ matrix.scope }}/test/**/*.test.js' --tfs DebuggerElectron
      - name: Debugger Electron suites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/test.sh --runGlob '**/contrib/${{ matrix.scope }}/test/**/*.test.js' --tfs DebuggerElectron
      - name: Debugger Electron suites (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\test.bat --runGlob **/contrib/${{ matrix.scope }}/test/**/*.test.js --tfs DebuggerElectron
      - name: Baseline browser suites
        run: |
          git checkout --detach "$BASE_SHA"
          node -e "require('fs').rmSync('out/vs/workbench/contrib/tasks/test/browser/taskProblemMonitor.test.js', { force: true })"
          npm run transpile-client
          npm run test-browser-no-install -- --browser ${{ matrix.browser }} --runGlob '**/contrib/${{ matrix.scope }}/test/**/*.test.js' --tfs Baseline
          git checkout --detach "$PATCH_SHA"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-${{ matrix.patch }}-${{ matrix.os }}
          path: test-results/
  source-quality:
    env:
      PATCH_SHA: ${{ matrix.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch: lazy
            sha: 98f90be7879884d32ee43af3d69c710d29e3ca59
    name: source-quality / ${{ matrix.patch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PATCH_SHA }}
          fetch-depth: 3
      - name: Verify tested SHA
        run: test "$(git rev-parse HEAD)" = "$PATCH_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install locked compiler tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix build --ignore-scripts --no-audit --no-fund
          node build/npm/electronTypes.ts
      - name: Validate module layers
        run: npm run valid-layers-check
      - name: Validate class field initialization
        run: npm run define-class-fields-check
      - name: TypeScript security compiler
        run: npm run tsec-compile-check
  codeql:
    env:
      PATCH_SHA: ${{ matrix.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch: lazy
            sha: 98f90be7879884d32ee43af3d69c710d29e3ca59
    name: codeql / ${{ matrix.patch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PATCH_SHA }}
      - name: Verify tested SHA
        run: test "$(git rev-parse HEAD)" = "$PATCH_SHA"
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /diagnostics:${{ matrix.patch }}/language:javascript-typescript
